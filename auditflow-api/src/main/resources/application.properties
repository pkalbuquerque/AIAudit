server.port=8080

# ==============================
# Database (Supabase PostgreSQL)
# ==============================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ==============================
# Flyway (migrations automáticas)
# ==============================
# baseline-on-migrate: necessário porque o banco já existe com tabelas criadas manualmente
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Sem sessão Hibernate aberta durante a serialização — leituras lazy são resolvidas
# dentro dos serviços (@Transactional) e materializadas nos DTOs.
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=24

# ==============================
# Logging
# ==============================
logging.level.com.auditflow=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.flyway=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================
# CORS
# ==============================
# Origens permitidas (separadas por vírgula). Em produção, defina CORS_ALLOWED_ORIGINS
# com o domínio real do front — nunca deixe localhost como origem confiável em prod.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==============================
# Seed de dados de demonstração
# ==============================
# true = popula o banco com dados de teste no startup (idempotente: pula se já existir).
# Login: admin@demo.auditflow.io / senha: demo1234. Desative com false após testar.
# ATENÇÃO: NUNCA deixar true em produção — o profile prod força false (application-prod.properties).
app.seed-demo=${APP_SEED_DEMO:true}

# ==============================
# Notificações por e-mail (Resend)
# ==============================
# true = envia e-mails de verdade; false = apenas registra no log (sem enviar).
app.notifications-enabled=${APP_NOTIFICATIONS_ENABLED:true}
# RESEND_API_KEY — nunca commitar a chave real no arquivo. Sem ela, nada é enviado.
resend.api-key=${RESEND_API_KEY:}
# Remetente. Em testes use o domínio do Resend; em produção, um domínio verificado.
resend.from=${RESEND_FROM:AuditFlow <onboarding@resend.dev>}
# URL do portal do cliente usada nos botões dos e-mails.
app.portal-url=${APP_PORTAL_URL:http://localhost:3000/portal}
# Raiz da aplicação web — base dos links de ativação/redefinição de senha.
app.web-url=${APP_WEB_URL:http://localhost:3000}
# Validade dos tokens: ativação de convite (horas) e redefinição de senha (minutos).
app.token.activation-hours=${APP_TOKEN_ACTIVATION_HOURS:168}
app.token.reset-minutes=${APP_TOKEN_RESET_MINUTES:60}
# Lembretes automáticos de itens atrasados/próximos do prazo (job diário).
app.reminders-enabled=${APP_REMINDERS_ENABLED:true}
app.reminders.cron=${APP_REMINDERS_CRON:0 0 8 * * *}

# ==============================
# Storage
# ==============================
# Provider de armazenamento de documentos: local (disco, dev/testes) ou r2 (Cloudflare R2).
# ATENÇÃO: em produção hospedada use r2 — o disco local costuma ser efêmero (perde arquivos no redeploy).
storage.provider=${STORAGE_PROVIDER:local}
# Diretório usado quando storage.provider=local.
storage.upload-dir=${STORAGE_UPLOAD_DIR:./uploads}

# --- Cloudflare R2 (usado quando storage.provider=r2) ---
# ID da conta Cloudflare (o endpoint é https://<account-id>.r2.cloudflarestorage.com).
r2.account-id=${R2_ACCOUNT_ID:}
# Credenciais do token de API R2 (Access Key ID / Secret Access Key).
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
# Nome do bucket R2 onde os documentos são gravados.
r2.bucket=${R2_BUCKET:}

# ==============================
# Actuator / Health check
# ==============================
# Expõe apenas /actuator/health (para probes de hospedagem). Sem detalhes p/ quem não está autenticado.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Habilita /actuator/health/liveness e /actuator/health/readiness (containers/K8s).
management.endpoint.health.probes.enabled=true

# ==============================
# Multipart Upload
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
