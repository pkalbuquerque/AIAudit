# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# Database (Supabase PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://SEU_HOST.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=SUA_SENHA_SUPABASE
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT
# ==============================
jwt.secret=TROQUE_ESTA_CHAVE_SECRETA_POR_UMA_FORTE_COM_MINIMO_256_BITS
jwt.expiration-hours=24

# ==============================
# Logging
# ==============================
logging.level.com.auditflow=DEBUG
