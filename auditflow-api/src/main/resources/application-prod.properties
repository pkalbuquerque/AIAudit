# ==============================
# Production overrides
# Activate with: --spring.profiles.active=prod
# ==============================

# Disable SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Reduce log verbosity
logging.level.com.auditflow=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# CORS — set to real frontend URL in prod
# cors.allowed-origins=https://app.auditflow.com.br

# Seed de demonstração — SEMPRE desligado em produção. O DataSeeder cria um ADMIN
# com senha pública (demo1234); deixá-lo ativo aqui é uma falha crítica de segurança.
app.seed-demo=false

# Storage — produção usa Cloudflare R2 por padrão (disco local é efêmero em host).
# As credenciais R2_* vêm do ambiente; sem elas o boot falha (fail-fast intencional).
storage.provider=r2

# Documentação da API não é exposta em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
