# ==============================================================
# Profile de teste — banco H2 em memória, sem rede e sem segredos.
# Ativado por @ActiveProfiles("test").
# ==============================================================

spring.datasource.url=jdbc:h2:mem:auditflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema gerado pelo Hibernate a partir das entidades (migrations Flyway são SQL de Postgres).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

jwt.secret=segredo-de-teste-apenas-para-junit-0123456789
app.seed-demo=false
app.notifications-enabled=false
app.reminders-enabled=false
storage.provider=local
storage.upload-dir=${java.io.tmpdir}/auditflow-test-uploads
