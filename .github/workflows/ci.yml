name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — build & testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Os testes usam H2 em memória (profile test) — nenhum segredo necessário.
      - name: Testes
        run: ./mvnw -B test

  web:
    name: Web — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: auditflow-web/package-lock.json
      # npm install (não npm ci): o lock é gerado em Windows e algumas deps opcionais
      # wasm (@emnapi/*, via resolver de ESLint) resolvem versões diferentes no Linux,
      # o que faz o npm ci (estrito) falhar. O tsc não usa esses bindings.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
